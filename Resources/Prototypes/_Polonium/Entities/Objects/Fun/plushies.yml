- type: entity
  parent: BasePlushie
  id: PlushieItanKio
  name: Pluszak Itan-Kio
  description: Pluszowa reprezentacja bardzo (nie)kompetentnego technika atmosferyki
  components:
  - type: Sprite
    sprite: _Polonium/Objects/Fun/Plushies/ItanKio-Plush.rsi
    state: icon
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: Edible
    requiresSpecialDigestion: true
    useSound:
      path: /Audio/Items/Toys/weh.ogg
  - type: MeleeWeapon
    wideAnimationRotation: 180
    attackRate: 15
    soundHit:
      path: /Audio/Items/Toys/weh.ogg

- type: entity
  parent: BaseItem
  id: ItanKioGoBoom
  name: Pluszak Itan-Kio
  description: "Instrukcja obsługi: Przykręć jego ogon i rzuć w ofiarę twojego wyboru"
  suffix: BOMBA, NIE MAPOWAĆ
  components:
  - type: Sprite
    sprite: _Polonium/Objects/Fun/Plushies/ItanKio-Plush.rsi
    state: icon
  - type: TriggerOnUse
  - type: Explosive
    explosionType: Minibomb
    totalIntensity: 300
    intensitySlope: 30
    maxIntensity: 60
  - type: ExplodeOnTrigger
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:TimerStartBehavior
    - trigger:
        !type:DamageTrigger
        damage: 45
      behaviors:
      - !type:TriggerBehavior
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic

- type: entity
  parent: PlushieMoth
  id: PlushieMothDeathshead
  name: pluszak Asa Trupiogłowego
  description: Puszysty pluszak przypominający pewnego barmana ćmę. Widnieje na nim mały napis "Nie dawać whiskey po północy".
  components:
  - type: Sprite
    sprite: _Polonium/Objects/Fun/Plushies/deathshead.rsi
    state: icon
  - type: ReactionMixer
    mixMessage: "spoon-mixing-success"
    timeToMix: 0.5
    reactionTypes:
    - Stir
  - type: Clothing
    sprite: _Polonium/Objects/Fun/Plushies/deathshead.rsi

- type: entity
  parent: [DrinkVisualsAllFilled, DrinkBottleGlassBase]
  id: DrinkBottleAceDeathshead
  name: pluszak Asa Trupiogłowego
  description: Puszysty pluszak przypominający pewnego barmana ćmę. Waży całkiem dużo jak na pluszaka.
  components:
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "icon_open"} # lid off
          False: {state: "icon"} # lid on
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left_open
      right:
      - state: inhand-right_open
  - type: Sprite
    sprite: _Polonium/Objects/Fun/Plushies/deathshead.rsi
    layers:
    - state: icon
      map: ["enum.OpenableVisuals.Layer"]
    - state: fill-3
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 3
  - type: ExaminableSolution
    examinableWhileClosed: false
    heldOnly: true

- type: entity
  parent: DrinkBottleAceDeathshead
  id: DrinkAceDeathsheadBottleFull
  suffix: Full
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Whiskey
        Quantity: 20
      - ReagentId: DrGibb
        Quantity: 60
      - ReagentId: Ice
        Quantity: 40
